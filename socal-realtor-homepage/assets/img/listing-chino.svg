<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9d7b2"/>
      <stop offset="100%" stop-color="#fdf0e2"/>
    </linearGradient>
    <linearGradient id="glow4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky4)"/>
  <circle cx="640" cy="130" r="58" fill="#fff" opacity=".55"/>
  <rect width="800" height="330" fill="url(#glow4)"/>

  <!-- distant ridge line -->
  <path d="M0 330 L120 286 L215 320 L330 262 L455 318 L560 278 L680 316 L800 284 L800 372 L0 372 Z"

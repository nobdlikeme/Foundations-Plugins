    <line x1="240" y1="424" x2="352" y2="424"/>
    <line x1="240" y1="450" x2="352" y2="450"/>
  </g>

  <!-- windows -->
  <rect x="392" y="360" width="76" height="70" rx="3" fill="#2b3a45" opacity=".7"/>
  <rect x="392" y="360" width="76" height="70" rx="3" fill="none" stroke="#5f3b2a" stroke-width="5"/>
  <rect x="500" y="360" width="60" height="70" rx="3" fill="#2b3a45" opacity=".7"/>
  <rect x="500" y="360" width="60" height="70" rx="3" fill="none" stroke="#5f3b2a" stroke-width="5"/>


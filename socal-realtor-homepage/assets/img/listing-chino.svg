  <g fill="#5f7a4a">
    <path d="M705 300 Q660 274 630 292 Q668 288 705 312 Z"/>
    <path d="M705 300 Q750 274 780 292 Q742 288 705 312 Z"/>
    <path d="M705 300 Q688 258 700 232 Q712 262 712 306 Z"/>

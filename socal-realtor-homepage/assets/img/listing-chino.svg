  <rect x="392" y="440" width="0" height="0" fill="none"/>
  <path d="M392 482 L392 444 Q392 436 400 436 L438 436 Q446 436 446 444 L446 482 Z" fill="#9a6247"/>
  <circle cx="437" cy="462" r="3" fill="#f3e6cf"/>


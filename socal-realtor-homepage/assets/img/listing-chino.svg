  <path d="M0 356 L140 322 L268 352 L402 312 L530 350 L668 320 L800 348 L800 400 L0 400 Z"
        fill="#ae8468" opacity=".85"/>

  <!-- ground -->
  <rect y="392" width="800" height="208" fill="#c7bb9e"/>
  <rect y="392" width="800" height="12" fill="#000" opacity=".06"/>

  <!-- driveway -->
  <path d="M300 600 L500 600 L440 470 L360 470 Z" fill="#e8e2d6" opacity=".85"/>

  <!-- house -->
  <path d="M176 300 L400 186 L624 300 L624 316 L176 316 Z" fill="#9a6247"/>
  <rect x="206" y="312" width="388" height="170" fill="#fbf6ef"/>
